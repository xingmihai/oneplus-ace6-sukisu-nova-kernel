name: Build ktm kernel (SukiSU-Nova + SUSFS + AnyKernel3)

on:
  workflow_dispatch:
    inputs:
      sukisu_nova:
        description: Integrate SukiSU-Nova main branch
        required: true
        default: true
        type: boolean
      susfs:
        description: Integrate SUSFS via SukiSU-Nova builtin branch
        required: true
        default: true
        type: boolean
      kpm:
        description: Enable CONFIG_KPM (experimental)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ktm-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OnePlus Ace 6 ktm kernel
    runs-on: ubuntu-24.04
    env:
      KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sm8750.git
      KERNEL_BRANCH: lineage-24.0
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_ARM64_BRANCH: arm64-tools
      SUSFS_REF: gki-android15-6.6
      ARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CC: ccache clang
      HOSTCC: ccache gcc
      HOSTCXX: ccache g++
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc-aarch64-linux-gnu libelf-dev libssl-dev \
            libdw-dev pahole clang lld llvm cpio zip kmod

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ktm-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-ktm-${{ runner.os }}-

      - name: Configure ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=compiler_check=content
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Clone official LineageOS kernel
        run: |
          mkdir -p kernel/oneplus
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel/oneplus/sm8750
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            https://github.com/LineageOS/android_kernel_oneplus_sm8750-modules.git \
            kernel/oneplus/sm8750-modules
          git clone --depth=1 --branch "$KERNEL_BRANCH" \
            https://github.com/LineageOS/android_kernel_oneplus_sm8750-devicetrees.git \
            kernel/oneplus/sm8750-devicetrees
          git -C kernel/oneplus/sm8750 log -1 --oneline
          test -f kernel/oneplus/sm8750/drivers/base/kernelFwUpdate/Kconfig
          test -f kernel/oneplus/sm8750/arch/arm64/configs/vendor/sun_perf.config
          test -f kernel/oneplus/sm8750/arch/arm64/configs/vendor/oplus/sun_perf.config

      - name: Integrate SukiSU-Nova and optional SUSFS
        if: inputs.sukisu_nova == true
        working-directory: kernel/oneplus/sm8750
        run: |
          if [ "${{ inputs.susfs }}" = 'true' ]; then
            # The official guide states that the builtin branch carries SUSFS.
            curl -LSs 'https://git.zako.shirkneko.top:20004/shirkneko/SukiSU/raw/branch/main/kernel/setup.sh' \
              | bash -s builtin
          else
            curl -LSs 'https://git.zako.shirkneko.top:20004/shirkneko/SukiSU/raw/branch/main/kernel/setup.sh' \
              | bash -s builtin-new
          fi

      - name: Apply SUSFS 6.6 kernel patch
        if: inputs.susfs == true
        working-directory: kernel/oneplus/sm8750
        run: |
          git clone --depth=1 --branch "$SUSFS_REF" \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h \
            susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          patch --batch --forward -p1 \
            < susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          test -f fs/susfs.c

      - name: Configure kernel
        working-directory: kernel/oneplus/sm8750
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCONFIG_CONFIG="$PWD/out/.config"
          make O=out ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" gki_defconfig
          scripts/kconfig/merge_config.sh -m out/.config \
            arch/arm64/configs/vendor/sun_perf.config \
            arch/arm64/configs/vendor/oplus/sun_perf.config
          if [ "${{ inputs.sukisu_nova }}" = 'true' ]; then
            chmod +x scripts/config
            scripts/config --file out/.config --enable KPROBES
            scripts/config --file out/.config --enable EXT4_FS
            scripts/config --file out/.config --enable KSU
          fi
          if [ "${{ inputs.susfs }}" = 'true' ]; then
            chmod +x scripts/config
            scripts/config --file out/.config --enable KSU_SUSFS
          fi
          if [ "${{ inputs.kpm }}" = 'true' ]; then
            chmod +x scripts/config
            scripts/config --file out/.config --enable KPM
          fi
          make O=out ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          grep -E 'CONFIG_(KPROBES|EXT4_FS|KSU|KPM|KSU_SUSFS)=' out/.config || true

      - name: Build kernel Image
        working-directory: kernel/oneplus/sm8750
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j"$(nproc)" O=out ARCH="$ARCH" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" \
            CROSS_COMPILE="$CROSS_COMPILE" KCFLAGS=-O2 Image
          test -s out/arch/arm64/boot/Image
          ccache --show-stats || true

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 "$AK3_REPO" anykernel3
          # The default AK3 branch ships 32-bit ARM tools. Ace 6 is arm64,
          # so replace the bundled binaries with the official AArch64 set.
          git clone --depth=1 --branch "$AK3_ARM64_BRANCH" "$AK3_REPO" ak3-arm64-tools
          cp ak3-arm64-tools/* anykernel3/tools/
          readelf -h anykernel3/tools/busybox | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          readelf -h anykernel3/tools/magiskboot | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          rm -rf anykernel3/.git ak3-arm64-tools/.git
          cp anykernel/anykernel.sh anykernel3/anykernel.sh
          cp kernel/oneplus/sm8750/out/arch/arm64/boot/Image anykernel3/Image
          cp README.md anykernel3/README-project.md
          chmod +x anykernel3/anykernel.sh
          cd anykernel3
          zip -r9 "../AnyKernel3-ktm-${GITHUB_SHA::7}.zip" . \
            -x '.git/*' 'README.md' '*placeholder*'

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: ktm-kernel-Image-${{ github.sha }}
          path: kernel/oneplus/sm8750/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 14

      - name: Upload AnyKernel3 package
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-ktm-${{ github.sha }}
          path: AnyKernel3-ktm-*.zip
          if-no-files-found: error
          retention-days: 14
